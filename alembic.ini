# Alembic configuration.
#
#   alembic upgrade head        apply migrations
#   alembic downgrade -1        undo the last one
#   alembic current             what the database is on
#
# `sqlalchemy.url` is deliberately absent: env.py reads BHOOMI_DATABASE_URL, so
# there is exactly one place a connection string is configured and no way for a
# real credential to end up in a committed ini file.

[alembic]
script_location = backend/db/migrations
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
