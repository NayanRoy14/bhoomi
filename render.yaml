# Render blueprint: Bhoomi on the free tier.
#
#   Render dashboard -> New -> Blueprint -> pick this repo.
#
# Two services and one Key Value instance, all free. Postgres is deliberately
# NOT here: Render's free Postgres expires 30 days after creation and takes the
# deployment with it, so docs/deploy-render.md uses Neon instead, which is free
# without an expiry and supports PostGIS. BHOOMI_DATABASE_URL is therefore
# `sync: false` -- Render prompts for it rather than provisioning it.
#
# Read docs/deploy-render.md before deploying. The free tier imposes three
# behaviours that are surprising if you meet them without warning: the API
# sleeps after 15 minutes, its disk is ephemeral, and the worker shares a
# container with the API because Render has no free background worker.

services:
  # ---------------------------------------------------------------- API
  - name: bhoomi-api
    type: web
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    # Overrides the image's CMD. The ENTRYPOINT still runs, so migrations are
    # applied before this starts.
    dockerCommand: backend/render-start.sh
    # Oregon is Render's US-west region, and the Sentinel-2 COGs are in AWS
    # us-west-2. This is the single highest-leverage line in the file: the same
    # band read measured 5-175 s from India and about 8 s from a us-west host.
    # Do not move this closer to the audience -- the user waits on the job, and
    # the job waits on S3.
    region: oregon
    plan: free
    healthCheckPath: /health
    envVars:
      # ---- provided by you at deploy time -----------------------------
      #
      # The two URLs below cannot be filled in correctly before the services
      # exist, and they must NOT be guessed from the names in this file.
      # `onrender.com` is one global namespace: a taken name gets four random
      # characters appended, so `bhoomi` can become `bhoomi-8t7g.onrender.com`.
      # Deploy with placeholders, then read each service's real URL from its own
      # service page and correct these. Check every service -- getting one right
      # and assuming the other matched is how this went wrong the first time.
      #
      # The failure mode is quiet, which is why it deserves this much comment:
      # a wrong CORS origin leaves the API healthy and answering curl while the
      # browser calls it unreachable, because the preflight is rejected before
      # any application code runs.
      #
      # Neon's pooled connection string. See docs/deploy-render.md step 1.
      - key: BHOOMI_DATABASE_URL
        sync: false
      # The STATIC SITE's origin -- scheme included, no trailing slash. Needed
      # because the browser calls the API cross-origin here, unlike the Docker
      # Compose deployment where Caddy puts both behind one host.
      #
      # This is the one value that genuinely cannot be resolved automatically,
      # and it is worth saying why rather than leaving it looking like an
      # oversight. `fromService` can read another service's *private network*
      # hostname, which is not the public origin a browser sends, and it does
      # not support static sites as a source at all. So the API cannot ask
      # Render what the frontend's public URL is. Read it off the static site's
      # own page and paste it here.
      - key: BHOOMI_CORS_ORIGINS
        sync: false

      # BHOOMI_PUBLIC_BASE_URL is deliberately NOT here. Render sets
      # RENDER_EXTERNAL_URL automatically in every web service, holding this
      # service's own public URL with the scheme, and backend/storage.py falls
      # back to it. Prompting for it meant typing a hostname before the service
      # existed -- a guess, and a quiet one: a wrong value serves every request
      # correctly and only publishes a cog_uri that points nowhere.
      #
      # Set BHOOMI_PUBLIC_BASE_URL by hand only to override, e.g. a custom
      # domain in front of Render. Explicit still wins.

      # ---- wired automatically ----------------------------------------
      - key: BHOOMI_REDIS_URL
        fromService:
          name: bhoomi-queue
          type: keyvalue
          property: connectionString

      # ---- Cloudflare R2 (D14) ----------------------------------------
      #
      # All five are prompted rather than defaulted, and the deployment works
      # with all five left blank: `get_storage` selects S3Storage on the
      # presence of BHOOMI_S3_BUCKET alone, so an empty bucket name keeps the
      # local-disk behaviour this blueprint shipped with.
      #
      # Setting them is what fixes the ephemeral disk (D5): a COG in R2
      # outlives a redeploy, a spin-down and the container itself.
      - key: BHOOMI_S3_BUCKET
        sync: false
      # R2's S3 endpoint, WITH scheme:
      #   https://<account-id>.r2.cloudflarestorage.com
      - key: BHOOMI_S3_ENDPOINT
        sync: false
      - key: BHOOMI_S3_ACCESS_KEY_ID
        sync: false
      - key: BHOOMI_S3_SECRET_ACCESS_KEY
        sync: false
      # The bucket's PUBLIC base, which is a different host from the endpoint
      # above -- an r2.dev address or a custom domain.
      #
      # This one decides the shape of the whole deployment, so it is worth
      # knowing what setting it means. With it, `url_for` returns a stable
      # public URL, `cog_uri` points straight at R2, downloads stop passing
      # through the API, and the tile server needs no credentials. Without it
      # the bucket is private, `url_for` returns None, and every download and
      # every tile is streamed by a 0.1 CPU API container instead.
      #
      # Public also means public: anyone with the URL reads the object. That is
      # already true of `/download`, which is anonymous by design (PLAN.md 1.4),
      # so this publishes nothing that was not already served.
      - key: BHOOMI_S3_PUBLIC_BASE_URL
        sync: false

      # ---- tiles --------------------------------------------------------
      #
      # The public origin of `bhoomi-tiles`, scheme included, no trailing
      # slash. Left blank the API returns `tiles: null` and the UI says there
      # is no map preview rather than offering a link that 404s.
      #
      # Prompted rather than read with `fromService` for the same reason
      # BHOOMI_CORS_ORIGINS is: `fromService` yields the private network
      # hostname, and this URL is one the *browser* fetches. A private hostname
      # here would leave the API healthy and every tile request failing in the
      # client.
      #
      # Do not set this before BHOOMI_S3_PUBLIC_BASE_URL. Tiles over local disk
      # would need the tile server to share a filesystem with the API, and a
      # publicly reachable TiTiler with a filesystem is an arbitrary-file-read
      # -- which is exactly why docker-compose.yml binds it to 127.0.0.1 and
      # why `bhoomi-tiles` below is given no disk at all.
      - key: BHOOMI_TITILER_URL
        sync: false

      # ---- fixed ------------------------------------------------------
      # Render terminates TLS and forwards exactly one X-Forwarded-For hop.
      # Without this every request looks like it came from Render's proxy and
      # the whole internet shares one rate-limit budget.
      - key: BHOOMI_TRUSTED_PROXY_HOPS
        value: "1"
      # Tighter than the defaults: this is 0.1 CPU shared with the API.
      - key: BHOOMI_JOB_LIMIT
        value: "5"
      - key: BHOOMI_SEARCH_LIMIT
        value: "60"
      # A job on 0.1 CPU is slower than the 600 s default assumes.
      - key: BHOOMI_JOB_TIMEOUT
        value: "900"
      - key: BHOOMI_LOG_LEVEL
        value: INFO

  # ---------------------------------------------------------- frontend
  #
  # Named `bhoomi-site` rather than `bhoomi` because the hostname follows the
  # name, and the shorter one was already taken globally on onrender.com -- the
  # first deploy of this blueprint came up as `bhoomi-8t7g.onrender.com`.
  # A service's name here is the single source of truth for it: Render disables
  # the rename field in the dashboard for blueprint-managed services, so this
  # line is the only place it can be changed.
  - name: bhoomi-site
    type: web
    runtime: static
    rootDir: ./frontend
    # BHOOMI_STATIC_EXPORT switches next.config.mjs to `output: "export"`.
    # A static site is free, unlimited and never sleeps, so the UI stays up
    # even while the API is spun down -- which turns a dead-looking demo into
    # one that shows a slow first request.
    buildCommand: npm ci && BHOOMI_STATIC_EXPORT=1 npm run build
    staticPublishPath: ./out
    envVars:
      # Inlined into the bundle at build time, so changing it needs a rebuild,
      # not a restart. Set it to the API service's URL.
      - key: NEXT_PUBLIC_API_URL
        sync: false

  # -------------------------------------------------------------- tiles
  #
  # TiTiler, rendering the COGs in R2 as XYZ tiles (PLAN.md 11). Optional: the
  # rest of the deployment works without it and the UI degrades to "no map
  # preview", which is why it is last in the file and why nothing else
  # references it.
  #
  # **It is given no disk, and that is the security property, not an economy.**
  # TiTiler opens whatever `?url=` it is handed. With a filesystem attached and
  # a public hostname that is an arbitrary-file-read, which is why
  # docker-compose.yml binds it to 127.0.0.1. Reading COGs over https from a
  # public R2 bucket removes the filesystem from the picture entirely rather
  # than mitigating it -- there is no local path for a crafted url to name.
  #
  # The residual exposure is honest to state: this is still a public service
  # that will fetch a URL you give it, so it can be pointed at someone else's
  # GeoTIFF and used as a renderer for it. The extension allowlist below is the
  # only lever the image offers; it does not restrict the host. What limits the
  # damage is that there is nothing private to reach -- no volume, no
  # credentials, and no private network peer that serves anything.
  - name: bhoomi-tiles
    type: web
    runtime: image
    image:
      # Pinned, not `latest`. A floating tag on a public deployment means the
      # renderer can change under a README that shows its output.
      url: ghcr.io/developmentseed/titiler:2.2.1
    plan: free
    # Singapore rather than Oregon -- the opposite of the API, on purpose.
    #
    # The worker belongs next to the Sentinel-2 COGs in AWS us-west-2 because
    # it waits on S3. A tile server waits on nothing: it reads from R2, which
    # Cloudflare serves from an edge close to wherever it is asked, and then
    # answers a browser in India across many small requests where round trips
    # are the whole cost. So this one belongs near the audience.
    region: singapore
    # TiTiler's own liveness endpoint. Without it Render health-checks `/`,
    # which TiTiler answers with its landing page -- fine, but slower and it
    # would not notice a broken raster stack.
    healthCheckPath: /healthz
    envVars:
      # The static site's origin, same value as the API's BHOOMI_CORS_ORIGINS.
      # The browser fetches tiles directly from this service, so its CORS
      # headers matter as much as the API's.
      - key: TITILER_API_CORS_ORIGINS
        sync: false
      # Same GDAL tuning as the backend and compose: without it a windowed read
      # becomes a slow scan, and a tile server issues a great many windowed
      # reads. This is the difference between a map that pans and one that
      # crawls, on an instance with 0.1 CPU to spare.
      - key: GDAL_DISABLE_READDIR_ON_OPEN
        value: EMPTY_DIR
      - key: GDAL_HTTP_MULTIPLEX
        value: "YES"
      - key: VSI_CACHE
        value: "TRUE"
      - key: VSI_CACHE_SIZE
        value: "67108864"
      # Refuse to open anything that is not a GeoTIFF. Narrow, but it is the
      # one restriction the image supports, and it turns "fetch any URL" into
      # "fetch any URL that ends in .tif".
      - key: CPL_VSIL_CURL_ALLOWED_EXTENSIONS
        value: ".tif,.TIF,.tiff"
      # No AWS_* credentials here, deliberately. They would only be needed for
      # a PRIVATE bucket, read over /vsis3 -- and a public bucket is what lets
      # this service hold no secret at all. If you make the bucket private,
      # this service needs the key pair and the GDAL endpoint variables from
      # docker-compose.yml, and it stops being a service whose compromise costs
      # nothing.

# ------------------------------------------------------------- queue
  - name: bhoomi-queue
    type: keyvalue
    plan: free
    region: oregon
    # Internal only. An empty allow list means no public network access, which
    # is what you want -- only bhoomi-api needs to reach it.
    ipAllowList: []
    # Free Key Value does not persist to disk, and that is acceptable here by
    # design: PLAN.md 6 makes the jobs table the source of truth and the queue
    # a work list. Losing it costs in-flight jobs, which the state machine
    # already handles, rather than history.
    maxmemoryPolicy: noeviction
