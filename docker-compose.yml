# Bhoomi development environment.
#
#   docker compose up --build
#
#   frontend  http://localhost:3000
#   API       http://localhost:8000       docs at /docs
#   tiles     http://localhost:8001       TiTiler, loopback only -- see below

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: bhoomi-backend:dev
    environment:
      BHOOMI_LOG_LEVEL: ${BHOOMI_LOG_LEVEL:-INFO}
      BHOOMI_CORS_ORIGINS: ${BHOOMI_CORS_ORIGINS:-http://localhost:3000}
      BHOOMI_STAC_ENDPOINT: ${BHOOMI_STAC_ENDPOINT:-}
      BHOOMI_DATABASE_URL: postgresql://bhoomi:${POSTGRES_PASSWORD:-bhoomi}@postgres:5432/bhoomi
      BHOOMI_REDIS_URL: redis://redis:6379/0
      BHOOMI_OUTPUT_DIR: /app/outputs/jobs
      # Goes into outputs.cog_uri, so it must be the URL a *client* can reach --
      # not a compose service name, which resolves only inside the network.
      BHOOMI_PUBLIC_BASE_URL: ${BHOOMI_PUBLIC_BASE_URL:-http://localhost:8000}
      # Where TiTiler mounts the same volume, and where the browser reaches it.
      BHOOMI_TILE_ROOT: /app/outputs/jobs
      BHOOMI_TITILER_URL: ${BHOOMI_TITILER_URL:-http://localhost:8001}
    volumes:
      # The worker writes the COG, the API serves it. Shared because
      # LocalStorage is single-host by construction -- the constraint object
      # storage removes (PLAN.md O4).
      - outputs-data:/app/outputs/jobs
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    # Same image as the backend -- the worker imports the same processing code,
    # and a second Dockerfile would be a second thing to keep in step.
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: bhoomi-backend:dev
    command: ["python", "-m", "backend.queue.worker"]
    environment:
      BHOOMI_LOG_LEVEL: ${BHOOMI_LOG_LEVEL:-INFO}
      BHOOMI_DATABASE_URL: postgresql://bhoomi:${POSTGRES_PASSWORD:-bhoomi}@postgres:5432/bhoomi
      BHOOMI_REDIS_URL: redis://redis:6379/0
      BHOOMI_OUTPUT_DIR: /app/outputs/jobs
      BHOOMI_PUBLIC_BASE_URL: ${BHOOMI_PUBLIC_BASE_URL:-http://localhost:8000}
      # The backend has already migrated by the time this starts; two
      # containers racing to create the same table is a real failure.
      BHOOMI_SKIP_MIGRATIONS: "1"
    volumes:
      - outputs-data:/app/outputs/jobs
    # PLAN.md 8 caps concurrent jobs at 2, and that cap is only meaningful if
    # the number of workers matches it.
    deploy:
      replicas: 2
    # Overrides the image's HTTP check, which belongs to the backend: a worker
    # serves no HTTP, so it would have sat permanently unhealthy while working
    # perfectly. Redis reachability is the real liveness question for a worker
    # -- without it there is nothing to pull, and the container is idle rather
    # than broken, which is exactly the state a health check should surface.
    healthcheck:
      test: ["CMD", "python", "-c",
             "from backend.queue.connection import get_redis; get_redis().ping()"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  titiler:
    # Reads the COGs the worker wrote and serves XYZ tiles (PLAN.md 11).
    image: ghcr.io/developmentseed/titiler:latest
    environment:
      # Same GDAL tuning as the backend: without it a windowed read becomes a
      # slow scan, and a tile server issues a great many windowed reads.
      GDAL_DISABLE_READDIR_ON_OPEN: EMPTY_DIR
      GDAL_HTTP_MULTIPLEX: "YES"
      VSI_CACHE: "TRUE"
      VSI_CACHE_SIZE: "67108864"
      # The browser calls this directly, so CORS has to allow the frontend.
      TITILER_API_CORS_ORIGINS: ${BHOOMI_CORS_ORIGINS:-http://localhost:3000}
    volumes:
      # Read-only: the tile server has no business writing outputs.
      - outputs-data:/app/outputs/jobs:ro
    ports:
      # **Loopback only, deliberately.** TiTiler opens whatever path its `url`
      # parameter names, and while outputs live on a filesystem that makes a
      # public tile server an arbitrary-file-read. Binding to 127.0.0.1 keeps
      # it reachable from the browser on this machine and from nowhere else.
      # Object storage (PLAN.md O4) removes the exposure rather than hiding it:
      # `tile_source` becomes an https URL and this volume goes away.
      #
      # The image serves on 80 under gunicorn, not 8000 like the backend.
      - "127.0.0.1:8001:80"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # No persistence: the queue is a work list, not a record. The jobs table is
    # the source of truth (PLAN.md 6), so a lost queue costs in-flight work,
    # which the state machine already has to handle, rather than history.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  postgres:
    # postgis/postgis rather than plain postgres: the scenes footprint column is
    # GEOMETRY(Polygon, 4326) and the migration enables the extension (PLAN.md 6).
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: bhoomi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bhoomi}
      POSTGRES_DB: bhoomi
    healthcheck:
      # `-U bhoomi` matters: without it pg_isready asks for the root role and
      # reports the server unready while it is in fact serving.
      test: ["CMD-SHELL", "pg_isready -U bhoomi -d bhoomi"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Inlined at build time by Next.js, so it must be the URL the *browser*
        # will use -- not the compose service name, which only resolves inside
        # the network.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    image: bhoomi-frontend:dev
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  outputs-data:
